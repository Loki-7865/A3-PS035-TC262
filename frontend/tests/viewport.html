<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><title>NETSCOPE isolated viewport check</title><style>body{margin:0;background:#d8d6cf;font-family:system-ui}p{margin:12px}iframe{border:0;display:block;height:900px;max-width:none}</style></head><body><p id="label"></p><iframe title="Isolated investigations fixture" src="/"></iframe><script>const width = [320,390,768,1280].includes(Number(new URLSearchParams(location.search).get('width'))) ? Number(new URLSearchParams(location.search).get('width')) : 390; if(new URLSearchParams(location.search).has('dashboard')) document.querySelector('iframe').src='/?dashboard'; if(new URLSearchParams(location.search).has('demo')) document.querySelector('iframe').src='/?demo'; if(new URLSearchParams(location.search).has('live')) document.querySelector('iframe').src='/?live'; document.querySelector('iframe').style.width = width + 'px'; document.querySelector('#label').textContent = 'Synthetic data · ' + width + 'px viewport';; document.querySelector('iframe').addEventListener('load', () => {const frame = document.querySelector('iframe'); const report = () => { const d=frame.contentDocument; document.querySelector('#label').textContent = 'Synthetic data · ' + width + 'px viewport · content ' + d.documentElement.scrollWidth + 'px · viewport ' + d.documentElement.clientWidth + 'px'; }; new ResizeObserver(report).observe(frame.contentDocument.body); report(); });</script></body></html>
